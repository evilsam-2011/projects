# Minimal i3status config for development (CachyOS)
# see "man i3status" for documentation
general {
        colors = false
        interval = 5
}

order += "ethernet _first_"
order += "wireless _first_"
order += "disk /"
order += "memory"
order += "load"
order += "tztime local"

ethernet _first_ {
        format_up = "E: %ip"
        format_down = "E: down"
}

wireless _first_ {
        format_up = "W: %essid"
        format_down = ""
}

disk "/" {
        format = "%avail"
}

memory {
        format = "%used / %total"
}

load {
        format = "%1min"
}

tztime local {
        format = "%a %d %b %H:%M"
}
