<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: url('images.jpg') center/cover no-repeat fixed;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 2rem;
}

.card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(16px);
  border-radius: 24px;
  padding: 3rem;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  max-width: 520px;
  width: 90vw;
}

.title {
  font-size: 1.1rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
  letter-spacing: 0.3px;
  margin-bottom: 0.5rem;
}

.phase-label {
  font-size: 0.85rem;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 2rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.timer-wrapper {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 2rem;
}

.timer-display {
  font-size: 4.5rem;
  font-weight: 300;
  color: #fff;
  letter-spacing: 4px;
  position: absolute;
  z-index: 2;
  font-variant-numeric: tabular-nums;
}

.progress-ring {
  width: 280px;
  height: 280px;
  transform: rotate(-90deg);
}

.progress-ring .bg {
  fill: none;
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 4;
}

.progress-ring .fg {
  fill: none;
  stroke: #a855f7;
  stroke-width: 4;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.4s ease;
  filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.4));
}

.session-count {
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.5);
  margin-bottom: 2.5rem;
}

.controls {
  display: flex;
  gap: 0.75rem;
  justify-content: center;
  align-items: center;
}

.btn {
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 12px 28px;
  border: none;
  cursor: pointer;
  border-radius: 12px;
  transition: all 0.15s;
  letter-spacing: 0.3px;
}

.btn:active {
  transform: scale(0.96);
}

.btn-start {
  background: #a855f7;
  color: #fff;
  box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
}

.btn-start:hover {
  background: #9333ea;
}

.btn-pause {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn-pause:hover {
  background: rgba(255, 255, 255, 0.18);
}

.btn-reset {
  background: transparent;
  color: rgba(255, 255, 255, 0.5);
  padding: 12px 16px;
}

.btn-reset:hover {
  color: rgba(255, 255, 255, 0.8);
}

.settings-btn {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 50;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.7);
  font-size: 1.2rem;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.settings-btn:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  z-index: 200;
  justify-content: center;
  align-items: center;
}

.modal-overlay.open {
  display: flex;
}

.modal {
  background: rgba(30, 30, 40, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 2rem;
  max-width: 360px;
  width: 90%;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.modal h2 {
  font-size: 1rem;
  font-weight: 600;
  color: #fff;
  margin-bottom: 1.5rem;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  padding: 0.5rem 0;
}

.setting-row label {
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.6);
}

.setting-row input {
  font-family: inherit;
  font-size: 0.85rem;
  width: 72px;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  color: #fff;
  text-align: center;
  transition: border-color 0.15s;
}

.setting-row input:focus {
  outline: none;
  border-color: #a855f7;
}

.btn-save {
  background: #a855f7;
  color: #fff;
  margin-top: 1rem;
  padding: 12px 32px;
  box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
}

.btn-save:hover {
  background: #9333ea;
}

.notification {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 150;
  font-size: 1.5rem;
  font-weight: 600;
  color: #fff;
  text-align: center;
  pointer-events: none;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(12px);
  padding: 1.5rem 3rem;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  animation: fadeIn 0.3s ease;
}

.notification.show {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

@media (max-width: 500px) {
  .card { padding: 2rem 1.5rem; }
  .timer-display { font-size: 3rem; }
  .progress-ring { width: 200px; height: 200px; }
  .title { font-size: 0.95rem; }
}
</style>
</head>
<body>
<div class="overlay"></div>

<button class="settings-btn" onclick="toggleSettings()">&#9881;</button>

<div class="container">
  <div class="card">
    <div class="title">Pomodoro</div>
    <div class="phase-label" id="phaseLabel">Work</div>

    <div class="timer-wrapper">
      <div class="timer-display" id="timerDisplay">25:00</div>
      <svg class="progress-ring" viewBox="0 0 200 200">
        <circle class="bg" cx="100" cy="100" r="88"/>
        <circle class="fg" id="progressCircle" cx="100" cy="100" r="88" stroke-dasharray="2 4" stroke-dashoffset="0"/>
      </svg>
    </div>

    <div class="session-count" id="sessionCount">&#127813; x 0</div>

    <div class="controls">
      <button class="btn btn-start" id="btnStart" onclick="startTimer()">Start</button>
      <button class="btn btn-pause" id="btnPause" onclick="pauseTimer()" style="display:none">Pause</button>
      <button class="btn btn-reset" onclick="resetTimer()">Reset</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="setting-row">
      <label>Work (min)</label>
      <input type="number" id="workTime" value="25" min="1" max="120">
    </div>
    <div class="setting-row">
      <label>Short Break (min)</label>
      <input type="number" id="shortBreak" value="5" min="1" max="30">
    </div>
    <div class="setting-row">
      <label>Long Break (min)</label>
      <input type="number" id="longBreak" value="15" min="1" max="60">
    </div>
    <div class="setting-row">
      <label>Long Break Every</label>
      <input type="number" id="longBreakInterval" value="4" min="1" max="10">
    </div>
    <button class="btn btn-save" onclick="saveSettings()">Save</button>
  </div>
</div>

<div class="notification" id="notification"></div>

<script>
let state = {
  phase: 'work',
  seconds: 25 * 60,
  totalSeconds: 25 * 60,
  isRunning: false,
  completedSessions: 0,
  workTime: 25,
  shortBreak: 5,
  longBreak: 15,
  longBreakInterval: 4,
  intervalId: null,
};

const RADIUS = 88;
const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updateDisplay() {
  document.getElementById('timerDisplay').textContent = formatTime(state.seconds);
  const pct = (state.totalSeconds - state.seconds) / state.totalSeconds;
  const circle = document.getElementById('progressCircle');
  circle.style.strokeDashoffset = CIRCUMFERENCE * (1 - Math.min(pct, 1));
  document.getElementById('sessionCount').textContent = '\uD83C\uDF45 x ' + state.completedSessions;

  const labels = { work: 'Work', shortBreak: 'Short Break', longBreak: 'Long Break' };
  document.getElementById('phaseLabel').textContent = labels[state.phase];
}

function showNotification(text) {
  const el = document.getElementById('notification');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 520;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
    setTimeout(() => {
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.frequency.value = 680;
      osc2.type = 'sine';
      gain2.gain.setValueAtTime(0.3, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc2.start();
      osc2.stop(ctx.currentTime + 0.6);
    }, 400);
  } catch(e) {}
}

function nextPhase() {
  if (state.phase === 'work') {
    state.completedSessions++;
    if (state.completedSessions % state.longBreakInterval === 0) {
      state.phase = 'longBreak';
      state.seconds = state.longBreak * 60;
    } else {
      state.phase = 'shortBreak';
      state.seconds = state.shortBreak * 60;
    }
    showNotification('Break time!');
  } else {
    state.phase = 'work';
    state.seconds = state.workTime * 60;
    showNotification('Work time!');
  }
  state.totalSeconds = state.seconds;
  state.isRunning = false;
  clearInterval(state.intervalId);
  state.intervalId = null;
  document.getElementById('btnStart').style.display = 'inline';
  document.getElementById('btnPause').style.display = 'none';
  updateDisplay();
  playBeep();
}

function tick() {
  if (state.seconds <= 0) {
    clearInterval(state.intervalId);
    state.intervalId = null;
    nextPhase();
    return;
  }
  state.seconds--;
  updateDisplay();
}

function startTimer() {
  if (state.isRunning) return;
  state.isRunning = true;
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnPause').style.display = 'inline';
  state.intervalId = setInterval(tick, 1000);
}

function pauseTimer() {
  state.isRunning = false;
  clearInterval(state.intervalId);
  state.intervalId = null;
  document.getElementById('btnStart').style.display = 'inline';
  document.getElementById('btnPause').style.display = 'none';
  document.getElementById('btnStart').textContent = 'Resume';
}

function resetTimer() {
  state.isRunning = false;
  clearInterval(state.intervalId);
  state.intervalId = null;
  state.phase = 'work';
  state.seconds = state.workTime * 60;
  state.totalSeconds = state.seconds;
  state.completedSessions = 0;
  document.getElementById('btnStart').style.display = 'inline';
  document.getElementById('btnPause').style.display = 'none';
  document.getElementById('btnStart').textContent = 'Start';
  updateDisplay();
}

function toggleSettings() {
  const modal = document.getElementById('settingsModal');
  modal.classList.toggle('open');
  if (modal.classList.contains('open')) {
    document.getElementById('workTime').value = state.workTime;
    document.getElementById('shortBreak').value = state.shortBreak;
    document.getElementById('longBreak').value = state.longBreak;
    document.getElementById('longBreakInterval').value = state.longBreakInterval;
  }
}

function saveSettings() {
  state.workTime = Math.max(1, parseInt(document.getElementById('workTime').value) || 25);
  state.shortBreak = Math.max(1, parseInt(document.getElementById('shortBreak').value) || 5);
  state.longBreak = Math.max(1, parseInt(document.getElementById('longBreak').value) || 15);
  state.longBreakInterval = Math.max(1, parseInt(document.getElementById('longBreakInterval').value) || 4);
  resetTimer();
  document.getElementById('settingsModal').classList.remove('open');
}

updateDisplay();
</script>
</body>
</html>
